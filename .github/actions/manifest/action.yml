name: Manifest
description: Build and push a multi-platform manifest to GHCR, then have the image mirror copy it to Docker Hub

inputs:
  platforms:
    #  eg [{"platform":"linux/amd64", "runner": "ARM64", "slug": "something-arm64"},{"platform":"linux/arm64", "runner": "ubuntu-latest", "slug": "something-amd64"}]
    description: JSON list of platforms to build for
    type: string
    required: true
  source_repository:
    description: The source repository to build from
    type: string
    required: true
  source_ref:
    description: The branch, tag or SHA to checkout and build from
    type: string
    required: true
  git_commit_hash:
    description: The git commit hash that was used in the deploy action. If empty (e.g. on a manifest-only "Re-run failed jobs"), it is re-derived from source_repository@source_ref.
    type: string
    required: false
  target_tag:
    description: Tag to push to
    type: string
    required: true
  target_repository:
    description: Repository to push to, such as ethpandaops/geth. Pushed to ghcr.io/<target_repository> and mirrored to the same name on Docker Hub
    type: string
    required: true
  harbor_registry:
    description: Harbor registry to push the images to
    type: string
    default: ''
  IMAGE_MIRROR_URL:
    description: secrets.IMAGE_MIRROR_URL
    required: true
  HARBOR_USERNAME:
    required: true
  HARBOR_PASSWORD:
    required: true

runs:
  using: composite
  steps:
  - name: Checkout this repo
    uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
  - name: Resolve git commit hash
    id: resolve_hash
    shell: bash
    env:
      INPUT_HASH: ${{ inputs.git_commit_hash }}
      SOURCE_REPOSITORY: ${{ inputs.source_repository }}
      SOURCE_REF: ${{ inputs.source_ref }}
    run: |
      hash="$INPUT_HASH"
      if [ -z "$hash" ]; then
        # "Re-run failed jobs" drops needs.<job>.outputs.*; re-derive so we never push a "<tag>-" trailing-dash manifest.
        echo "git_commit_hash input was empty; re-deriving from ${SOURCE_REPOSITORY}@${SOURCE_REF}"
        url="https://github.com/${SOURCE_REPOSITORY}.git"
        hash=$(git ls-remote "$url" "$SOURCE_REF" 2>/dev/null | head -n1 | awk '{print $1}' | cut -c1-7)
        if [ -z "$hash" ] && [[ "$SOURCE_REF" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
          hash=$(echo "$SOURCE_REF" | cut -c1-7)
        fi
      fi
      if [ -z "$hash" ]; then
        echo "::error::Could not resolve git_commit_hash from input or by re-deriving from ${SOURCE_REPOSITORY}@${SOURCE_REF}; refusing to push trailing-dash tag"
        exit 1
      fi
      echo "git_commit_hash=$hash" >> "$GITHUB_OUTPUT"
      echo "Resolved git_commit_hash: $hash"
  - name: Login to GHCR
    uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
    with:
      registry: ghcr.io
      username: ${{ github.actor }}
      password: ${{ github.token }}
  - name: Generate images list
    id: generate_images_list
    shell: bash
    run: |
      PLATFORMS='${{ inputs.platforms }}'

      # Iterate over the platforms and build the image list
      len=$(echo $PLATFORMS | jq '. | length')
      for ((i=0; i<$len; i++)); do
          slug=$(echo $PLATFORMS | jq -r --argjson i $i '.[$i].slug')
          image="ghcr.io/${{ inputs.target_repository }}:${{ inputs.target_tag }}-$slug"

          if docker buildx imagetools inspect "$image" > /dev/null; then
            IMAGES+="$image "
            TAGS+="$image $image-${{ steps.resolve_hash.outputs.git_commit_hash }} "
          else
            echo "Warning: $image not found, skipping $slug"
          fi
      done

      TAGS+="ghcr.io/${{ inputs.target_repository }}:${{ inputs.target_tag }} ghcr.io/${{ inputs.target_repository }}:${{ inputs.target_tag }}-${{ steps.resolve_hash.outputs.git_commit_hash }} "

      IMAGES=${IMAGES::-1}  # Remove the trailing space
      echo "IMAGES: $IMAGES"
      echo "images=$IMAGES" >> $GITHUB_OUTPUT

      TAGS=${TAGS::-1}  # Remove the trailing space
      echo "TAGS: $TAGS"
      echo "tags=$TAGS" >> $GITHUB_OUTPUT
  - name: Check if there is atleast one image
    if: ${{ steps.generate_images_list.outputs.images == '[]' || steps.generate_images_list.outputs.images == '' }}
    shell: bash
    run: exit 1
  - name: Set up Docker Context for Buildx
    shell: bash
    id: buildx-context
    run: |
      docker context create builders
  - name: Set up Docker Buildx
    id: buildx_setup
    continue-on-error: true
    uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
    with:
      endpoint: builders
  - name: Wait before retrying Docker Buildx setup
    if: steps.buildx_setup.outcome == 'failure'
    shell: bash
    run: sleep 30
  - name: Set up Docker Buildx (retry)
    if: steps.buildx_setup.outcome == 'failure'
    uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
    with:
      endpoint: builders
  - name: Login to harbor registry
    if: ${{ inputs.harbor_registry != '' }}
    id: harbor_login
    continue-on-error: true
    uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
    with:
      registry: ${{ inputs.harbor_registry }}
      username: ${{ inputs.HARBOR_USERNAME }}
      password: ${{ inputs.HARBOR_PASSWORD }}

  - name: Create and push manifest images to GHCR
    id: create
    shell: bash
    run: |
      set -euo pipefail
      docker buildx imagetools create --dry-run -t ghcr.io/${{ inputs.target_repository }}:${{ inputs.target_tag }} -t ghcr.io/${{ inputs.target_repository }}:${{ inputs.target_tag }}-${{ steps.resolve_hash.outputs.git_commit_hash }} ${{ steps.generate_images_list.outputs.images }}
      metadata="${RUNNER_TEMP}/manifest-metadata.json"
      docker buildx imagetools create --metadata-file "$metadata" -t ghcr.io/${{ inputs.target_repository }}:${{ inputs.target_tag }} -t ghcr.io/${{ inputs.target_repository }}:${{ inputs.target_tag }}-${{ steps.resolve_hash.outputs.git_commit_hash }} ${{ steps.generate_images_list.outputs.images }}
      # The index this job pushed, so the mirror step attests it and not
      # whatever the tags point to by then.
      digest=$(jq -r '."containerimage.descriptor".digest' "$metadata")
      echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      echo "digest: ${digest}"
  - name: Create and push manifest images to harbor (best-effort)
    if: ${{ inputs.harbor_registry != '' && steps.harbor_login.outcome == 'success' }}
    continue-on-error: true
    shell: bash
    run: |
      echo "Pushing manifest to harbor registry (best-effort)..."
      docker buildx imagetools create \
        -t ${{ inputs.harbor_registry }}/${{ inputs.target_repository }}:${{ inputs.target_tag }} \
        -t ${{ inputs.harbor_registry }}/${{ inputs.target_repository }}:${{ inputs.target_tag }}-${{ steps.resolve_hash.outputs.git_commit_hash }} \
        ${{ steps.generate_images_list.outputs.images }} || echo "Harbor manifest push failed, continuing..."
  # The platform jobs attested the images they built; this job attests only
  # the index it made from them.
  - name: Mirror to Docker Hub
    if: github.ref == 'refs/heads/master'
    uses: ./.github/actions/mirror
    with:
      tags: |
        ghcr.io/${{ inputs.target_repository }}:${{ inputs.target_tag }}
        ghcr.io/${{ inputs.target_repository }}:${{ inputs.target_tag }}-${{ steps.resolve_hash.outputs.git_commit_hash }}
      digest: ${{ steps.create.outputs.digest }}
      attest-platforms: "false"
      mirror-url: ${{ inputs.IMAGE_MIRROR_URL }}
