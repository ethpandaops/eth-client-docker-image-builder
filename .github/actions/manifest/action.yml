name: Publish
description: Validate architecture artifacts, publish images, and create multi-architecture indexes

inputs:
  platforms:
    description: JSON list of required build platforms
    required: true
  source_repository:
    description: Source repository expected in provenance
    required: true
  source_ref:
    description: Source ref expected in provenance
    required: true
  source_commit:
    description: Full source commit expected in provenance when already resolved
    required: false
  source_patch:
    description: Source patch expected in provenance
    required: false
  source_submodules:
    description: Source submodule mode expected in provenance
    default: "false"
    required: false
  build_script:
    description: Build script expected in provenance
    required: false
  build_args:
    description: Docker build arguments expected in provenance
    default: ""
    required: false
  build_args_script:
    description: Build argument script expected in provenance
    required: false
  target_dockerfile:
    description: Configured Dockerfile path expected in provenance
    default: ./source/Dockerfile
    required: false
  build_method:
    description: Build method expected in provenance
    default: bazel
    required: false
  GOPROXY:
    description: GOPROXY expected in provenance
    required: false
  git_commit_hash:
    description: Retained for compatibility; provenance supplies the validated commit
    required: false
  target_tag:
    description: Multi-architecture target tag
    required: true
  target_repository:
    description: Target image repository
    required: true
  harbor_registry:
    description: Optional secondary registry
    default: ''
    required: false
  DOCKER_USERNAME:
    description: Docker Hub publisher username
    required: true
  DOCKER_PASSWORD:
    description: Docker Hub publisher token
    required: true
  HARBOR_USERNAME:
    description: Secondary registry publisher username
    required: false
  HARBOR_PASSWORD:
    description: Secondary registry publisher token
    required: false

runs:
  using: composite
  steps:
    - name: Checkout publisher configuration
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        ref: ${{ github.sha }}
        persist-credentials: false

    - name: Select architecture artifacts
      id: artifact_selector
      shell: bash
      env:
        TARGET_REPOSITORY: ${{ inputs.target_repository }}
        TARGET_TAG: ${{ inputs.target_tag }}
      run: |
        set -euo pipefail
        target_id="$(printf '%s\n%s\n' "$TARGET_REPOSITORY" "$TARGET_TAG" | sha256sum | awk '{print $1}')"
        echo "pattern=image-${target_id}-*" >> "$GITHUB_OUTPUT"

    - name: Download architecture artifacts
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        pattern: ${{ steps.artifact_selector.outputs.pattern }}
        path: ${{ runner.temp }}/architecture-artifacts

    - name: Validate provenance and archives
      id: validate
      shell: bash
      env:
        PLATFORMS: ${{ inputs.platforms }}
        SOURCE_REPOSITORY: ${{ inputs.source_repository }}
        SOURCE_REF: ${{ inputs.source_ref }}
        EXPECTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
        SOURCE_PATCH: ${{ inputs.source_patch }}
        SOURCE_SUBMODULES: ${{ inputs.source_submodules }}
        BUILD_SCRIPT: ${{ inputs.build_script }}
        BUILD_ARGS: ${{ inputs.build_args }}
        BUILD_ARGS_SCRIPT: ${{ inputs.build_args_script }}
        TARGET_DOCKERFILE: ${{ inputs.target_dockerfile }}
        BUILD_METHOD: ${{ inputs.build_method }}
        GOPROXY: ${{ inputs.GOPROXY }}
        TARGET_REPOSITORY: ${{ inputs.target_repository }}
        TARGET_TAG: ${{ inputs.target_tag }}
        BUILDER_REPOSITORY: ${{ github.repository }}
        BUILDER_COMMIT: ${{ github.sha }}
        WORKFLOW_REF: ${{ github.workflow_ref }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
      run: |
        set -euo pipefail
        root="${RUNNER_TEMP}/architecture-artifacts"
        validated="${RUNNER_TEMP}/validated-images.tsv"
        : > "$validated"
        source_commit=""

        while IFS=$'\t' read -r platform slug; do
          expected_tag="${TARGET_TAG}-${slug}"
          selected_attempt=0
          matches=()
          while IFS= read -r provenance; do
            if jq -e \
              --arg builder_repository "$BUILDER_REPOSITORY" \
              --arg builder_commit "$BUILDER_COMMIT" \
              --arg workflow_ref "$WORKFLOW_REF" \
              --arg run_id "$RUN_ID" \
              --arg source_repository "$SOURCE_REPOSITORY" \
              --arg source_ref "$SOURCE_REF" \
              --arg target_repository "$TARGET_REPOSITORY" \
              --arg target_tag "$expected_tag" \
              --arg platform "$platform" \
              '.schema == 1 and .builder.repository == $builder_repository and .builder.commit == $builder_commit and .builder.workflow_ref == $workflow_ref and .builder.run_id == $run_id and .source.repository == $source_repository and .source.ref == $source_ref and .image.repository == $target_repository and .image.tag == $target_tag and .image.platform == $platform' \
              "$provenance" >/dev/null; then
              attempt="$(jq -r '.builder.run_attempt' "$provenance")"
              if [[ "$attempt" =~ ^[1-9][0-9]*$ ]] && [ "$attempt" -le "$RUN_ATTEMPT" ]; then
                if [ "$attempt" -gt "$selected_attempt" ]; then
                  selected_attempt="$attempt"
                  matches=("$provenance")
                elif [ "$attempt" -eq "$selected_attempt" ]; then
                  matches+=("$provenance")
                fi
              fi
            fi
          done < <(find "$root" -name provenance.json -type f -print)

          if [ "${#matches[@]}" -ne 1 ]; then
            echo "::error::Expected one validated artifact for $platform, found ${#matches[@]}"
            exit 1
          fi

          provenance="${matches[0]}"
          commit="$(jq -r '.source.commit' "$provenance")"
          short_commit="$(jq -r '.source.short_commit' "$provenance")"
          archive_sha256="$(jq -r '.image.archive_sha256' "$provenance")"
          image_id="$(jq -r '.image.id' "$provenance")"
          config_digest="$(jq -r '.config_digest' "$provenance")"
          if ! [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || [ "$short_commit" != "${commit:0:7}" ]; then
            echo "::error::Invalid source commit identity for $platform"
            exit 1
          fi
          if ! [[ "$archive_sha256" =~ ^[0-9a-f]{64}$ ]] || ! [[ "$config_digest" =~ ^[0-9a-f]{64}$ ]] || ! [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid digest metadata for $platform"
            exit 1
          fi
          if ! jq -e '.build.resolved_args | type == "string"' "$provenance" >/dev/null; then
            echo "::error::Invalid resolved build arguments in provenance for $platform"
            exit 1
          fi
          expected_dockerfile="$TARGET_DOCKERFILE"
          if [ -n "$TARGET_DOCKERFILE" ] && [ "$(basename "$TARGET_DOCKERFILE")" = "Dockerfile" ]; then
            candidate="$(dirname "$TARGET_DOCKERFILE")/Dockerfile.${TARGET_TAG}"
            if [ -f "$candidate" ]; then
              expected_dockerfile="$candidate"
            fi
          fi
          expected_config_digest="$(jq -cn \
            --arg builder "$BUILDER_COMMIT" \
            --arg source_repository "$SOURCE_REPOSITORY" \
            --arg source_ref "$SOURCE_REF" \
            --arg source_commit "$commit" \
            --arg source_patch "$SOURCE_PATCH" \
            --arg source_submodules "$SOURCE_SUBMODULES" \
            --arg build_script "$BUILD_SCRIPT" \
            --arg build_args "$BUILD_ARGS" \
            --arg build_args_script "$BUILD_ARGS_SCRIPT" \
            --arg target_repository "$TARGET_REPOSITORY" \
            --arg target_tag "$expected_tag" \
            --arg target_dockerfile "$expected_dockerfile" \
            --arg platform "$platform" \
            --arg build_method "$BUILD_METHOD" \
            --arg goproxy "$GOPROXY" \
            '$ARGS.named' | sha256sum | awk '{print $1}')"
          if [ "$config_digest" != "$expected_config_digest" ]; then
            echo "::error::Configuration digest validation failed for $platform"
            exit 1
          fi
          target_id="$(printf '%s\n%s\n' "$TARGET_REPOSITORY" "$TARGET_TAG" | sha256sum | awk '{print $1}')"
          expected_artifact_name="image-${target_id}-${slug}-${config_digest:0:16}-${archive_sha256}-${selected_attempt}"
          if [ "$(basename "$(dirname "$provenance")")" != "$expected_artifact_name" ]; then
            echo "::error::Artifact name validation failed for $platform"
            exit 1
          fi
          if [ -n "$EXPECTED_SOURCE_COMMIT" ] && [ "$commit" != "$EXPECTED_SOURCE_COMMIT" ]; then
            echo "::error::Source commit $commit does not match requested commit $EXPECTED_SOURCE_COMMIT"
            exit 1
          fi
          if [ -n "$source_commit" ] && [ "$source_commit" != "$commit" ]; then
            echo "::error::Architecture artifacts use different source commits"
            exit 1
          fi
          source_commit="$commit"

          archive="$(dirname "$provenance")/${archive_sha256}.tar"
          if [ ! -f "$archive" ] || [ "$(sha256sum "$archive" | awk '{print $1}')" != "$archive_sha256" ]; then
            echo "::error::Archive digest validation failed for $platform"
            exit 1
          fi
          docker load --input "$archive" >/dev/null
          loaded_id="$(docker image inspect --format '{{.Id}}' "${TARGET_REPOSITORY}:${expected_tag}")"
          commit_id="$(docker image inspect --format '{{.Id}}' "${TARGET_REPOSITORY}:${expected_tag}-${short_commit}")"
          if [ "$loaded_id" != "$image_id" ] || [ "$commit_id" != "$image_id" ]; then
            echo "::error::Loaded image identity validation failed for $platform"
            exit 1
          fi
          loaded_platform="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "${TARGET_REPOSITORY}:${expected_tag}")"
          if [ "$loaded_platform" != "$platform" ]; then
            echo "::error::Loaded image platform $loaded_platform does not match expected platform $platform"
            exit 1
          fi
          printf '%s\t%s\t%s\n' "$platform" "$expected_tag" "$short_commit" >> "$validated"
        done < <(jq -r '.[] | [.platform, .slug] | @tsv' <<< "$PLATFORMS")

        if [ -z "$source_commit" ]; then
          echo "::error::No architecture artifacts were validated"
          exit 1
        fi
        echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
        echo "source_commit_short=${source_commit:0:7}" >> "$GITHUB_OUTPUT"

    - name: Validate source commit
      shell: bash
      env:
        SOURCE_REPOSITORY: ${{ inputs.source_repository }}
        SOURCE_COMMIT: ${{ steps.validate.outputs.source_commit }}
      run: |
        set -euo pipefail
        source_dir="${RUNNER_TEMP}/source-identity"
        rm -rf "$source_dir"
        git -C "${RUNNER_TEMP}" init -q source-identity
        git -C "$source_dir" -c protocol.version=2 fetch --no-tags --depth=1 \
          "https://github.com/${SOURCE_REPOSITORY}.git" "$SOURCE_COMMIT"
        resolved="$(git -C "$source_dir" rev-parse FETCH_HEAD^{commit})"
        if [ "$resolved" != "$SOURCE_COMMIT" ]; then
          echo "::error::Source commit does not resolve in the configured repository"
          exit 1
        fi

    - name: Set up Docker context
      shell: bash
      run: docker context use publisher || docker context create publisher

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      with:
        endpoint: publisher

    - name: Log in to Docker Hub
      uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
      with:
        username: ${{ inputs.DOCKER_USERNAME }}
        password: ${{ inputs.DOCKER_PASSWORD }}

    - name: Publish architecture images and indexes
      shell: bash
      env:
        TARGET_REPOSITORY: ${{ inputs.target_repository }}
        TARGET_TAG: ${{ inputs.target_tag }}
        SOURCE_COMMIT_SHORT: ${{ steps.validate.outputs.source_commit_short }}
      run: |
        set -euo pipefail
        validated="${RUNNER_TEMP}/validated-images.tsv"
        digests="${RUNNER_TEMP}/dockerhub-digests.tsv"
        : > "$digests"
        refs=()

        while IFS=$'\t' read -r platform architecture_tag short_commit; do
          image="${TARGET_REPOSITORY}:${architecture_tag}"
          commit_image="${image}-${short_commit}"
          push_output="$(docker push "$image" | tee /dev/stderr)"
          digest="$(awk '{ for (i = 1; i < NF; i++) if ($i == "digest:" && $(i + 1) ~ /^sha256:[0-9a-f]{64}$/) print $(i + 1) }' <<< "$push_output" | tail -n1)"
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not capture registry digest for $image"
            exit 1
          fi
          commit_push_output="$(docker push "$commit_image" | tee /dev/stderr)"
          commit_digest="$(awk '{ for (i = 1; i < NF; i++) if ($i == "digest:" && $(i + 1) ~ /^sha256:[0-9a-f]{64}$/) print $(i + 1) }' <<< "$commit_push_output" | tail -n1)"
          if [ "$commit_digest" != "$digest" ]; then
            echo "::error::Architecture tags produced different registry digests"
            exit 1
          fi
          refs+=("${TARGET_REPOSITORY}@${digest}")
          printf '%s\t%s\t%s\n' "$architecture_tag" "$short_commit" "$digest" >> "$digests"
        done < "$validated"

        docker buildx imagetools create --dry-run \
          --tag "${TARGET_REPOSITORY}:${TARGET_TAG}" \
          --tag "${TARGET_REPOSITORY}:${TARGET_TAG}-${SOURCE_COMMIT_SHORT}" \
          "${refs[@]}"
        docker buildx imagetools create \
          --tag "${TARGET_REPOSITORY}:${TARGET_TAG}" \
          --tag "${TARGET_REPOSITORY}:${TARGET_TAG}-${SOURCE_COMMIT_SHORT}" \
          "${refs[@]}"

    - name: Log in to secondary registry
      if: inputs.harbor_registry != ''
      id: harbor_login
      continue-on-error: true
      uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
      with:
        registry: ${{ inputs.harbor_registry }}
        username: ${{ inputs.HARBOR_USERNAME }}
        password: ${{ inputs.HARBOR_PASSWORD }}

    - name: Publish architecture images and index to secondary registry
      if: inputs.harbor_registry != '' && steps.harbor_login.outcome == 'success'
      continue-on-error: true
      shell: bash
      env:
        HARBOR_REGISTRY: ${{ inputs.harbor_registry }}
        TARGET_REPOSITORY: ${{ inputs.target_repository }}
        TARGET_TAG: ${{ inputs.target_tag }}
        SOURCE_COMMIT_SHORT: ${{ steps.validate.outputs.source_commit_short }}
      run: |
        set -euo pipefail
        digests="${RUNNER_TEMP}/dockerhub-digests.tsv"
        harbor_refs=()

        while IFS=$'\t' read -r architecture_tag short_commit digest; do
          target="${HARBOR_REGISTRY}/${TARGET_REPOSITORY}:${architecture_tag}"
          docker buildx imagetools create \
            --tag "$target" \
            --tag "${target}-${short_commit}" \
            "${TARGET_REPOSITORY}@${digest}"
          harbor_digest="$(docker buildx imagetools inspect "$target" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          if ! [[ "$harbor_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not capture secondary registry digest for $target" >&2
            exit 1
          fi
          harbor_refs+=("${HARBOR_REGISTRY}/${TARGET_REPOSITORY}@${harbor_digest}")
        done < "$digests"

        docker buildx imagetools create \
          --tag "${HARBOR_REGISTRY}/${TARGET_REPOSITORY}:${TARGET_TAG}" \
          --tag "${HARBOR_REGISTRY}/${TARGET_REPOSITORY}:${TARGET_TAG}-${SOURCE_COMMIT_SHORT}" \
          "${harbor_refs[@]}"
