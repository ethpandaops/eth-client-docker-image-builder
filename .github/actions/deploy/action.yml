name: Deploy
description: Build and push a docker image to GHCR, then have the image mirror copy it to Docker Hub

inputs:
  source_repository:
    description: The source repository to build from
    type: string
    required: true
  source_ref:
    description: The branch, tag or SHA to checkout and build from
    type: string
    required: true
  source_commit:
    description: The specific commit SHA to checkout (takes precedence over source_ref)
    type: string
    required: false
  source_patch:
    description: The patch to apply to the source repository
    type: string
    required: false
  source_submodules:
    description: >-
      Passed to actions/checkout `submodules` (true / recursive). Checks them out with
      the job token, so builds don't clone them anonymously inside docker.
    type: string
    default: "false"
    required: false
  build_script:
    description: The bash script path in this repository to run instead of the Docker build & push script. You must push the image yourself.
    type: string
    required: false
  build_args:
    description: Build arguments to pass to the Docker build
    default: ""
    type: string
    required: false
  build_args_script:
    description: >-
      Bash script path in this repository that prints extra `KEY=value` docker build
      args on stdout, one per line. Several paths separated by spaces run in order. Runs after the source repository is checked out,
      so it can derive build args from the source. Also exported to the environment
      of build_script.
    type: string
    required: false
  target_tag:
    description: Tag to push to
    type: string
    required: true
  target_repository:
    description: Repository to push to, such as ethpandaops/geth. Pushed to ghcr.io/<target_repository> and mirrored to the same name on Docker Hub
    type: string
    required: true
  target_dockerfile:
    description: Dockerfile path in this repository to build from. Omit to use source repository Dockerfile
    type: string
    default: ./source/Dockerfile
    required: false
  platform:
    description: The platform to build for
    type: string
    required: true
  build_method:
    description: Build method to use (go or bazel)
    type: string
    default: go
    required: false
  harbor_registry:
    description: Harbor registry to push the images to
    type: string
    default: ''
  # Secrets
  IMAGE_MIRROR_URL:
    description: secrets.IMAGE_MIRROR_URL
    required: true
  MACOS_PASSWORD:
    required: true
  GOPROXY:
    required: false
  BAZEL_REMOTE_CACHE_PASSWORD:
    description: Credential for uploads to the Bazel remote cache. Without it, builds only read from the cache.
    required: false
  HARBOR_USERNAME:
    required: true
  HARBOR_PASSWORD:
    required: true

outputs:
  git_commit_hash:
    description: The git commit hash of the source repository
    value: ${{ steps.git_commit_hash.outputs.git_commit_hash }}
  git_commit_hash_full:
    description: The full git commit hash of the source repository
    value: ${{ steps.git_commit_hash_full.outputs.git_commit_hash_full }}
  resolved_dockerfile:
    description: Dockerfile path actually used (after per-tag convention resolution)
    value: ${{ steps.resolve_dockerfile.outputs.dockerfile }}

runs:
  using: composite
  steps:
  - name: Checkout this repo
    uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
  - name: Resolve target dockerfile (prefer ./<client>/Dockerfile.<tag>, also for minimal builds)
    id: resolve_dockerfile
    shell: bash
    env:
      TARGET_DOCKERFILE: ${{ inputs.target_dockerfile }}
      TARGET_TAG: ${{ inputs.target_tag }}
    run: |
      resolved="$TARGET_DOCKERFILE"
      target_basename="$(basename "$TARGET_DOCKERFILE")"
      if [ -n "$TARGET_DOCKERFILE" ] && { [ "$target_basename" = "Dockerfile" ] || [ "$target_basename" = "Dockerfile.minimal" ]; }; then
        base_tag="${TARGET_TAG%-*-*}"
        candidate="$(dirname "$TARGET_DOCKERFILE")/Dockerfile.${base_tag}"
        if [ -f "$candidate" ]; then
          echo "Using per-tag Dockerfile: $candidate (base tag: $base_tag)"
          resolved="$candidate"
        fi
      elif [ "$target_basename" = "Dockerfile.beacon" ]; then
        base_tag="${TARGET_TAG%-*-*}"
        base_tag="${base_tag%-minimal}"
        match=
        for candidate in "$(dirname "$TARGET_DOCKERFILE")"/Dockerfile.beacon-*; do
          suffix="${candidate##*/Dockerfile.beacon-}"
          case "$suffix" in minimal|*.dockerignore) continue ;; esac
          case "$base_tag" in
            "$suffix"|"$suffix"-*)
              if [ "${#suffix}" -gt "${#match}" ]; then match="$suffix"; fi ;;
          esac
        done
        if [ -n "$match" ]; then
          resolved="$(dirname "$TARGET_DOCKERFILE")/Dockerfile.beacon-$match"
          echo "Using per-tag Dockerfile: $resolved (base tag: $base_tag)"
        fi
      fi
      echo "dockerfile=$resolved" >> "$GITHUB_OUTPUT"
  - name: Check out source repository
    uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    with:
      repository: ${{ inputs.source_repository }}
      path: source
      ref: ${{ inputs.source_commit || inputs.source_ref }}
      fetch-depth: 0
      submodules: ${{ inputs.source_submodules }}
  - name: get short git commit hash
    id: git_commit_hash
    shell: bash
    run: |
      cd source
      echo "git_commit_hash=$(echo $(git log --pretty=format:'%h' -n 1 --abbrev=7))" >> $GITHUB_OUTPUT
  - name: get full git commit hash
    id: git_commit_hash_full
    shell: bash
    run: |
      cd source
      echo "git_commit_hash_full=$(echo $(git log --pretty=format:'%H' -n 1))" >> $GITHUB_OUTPUT
  - name: Apply patch to source repository
    shell: bash
    if: inputs.source_patch
    run: |
      cd source
      patch -p 1 < ../${{ inputs.source_patch }}
  - name: Resolve dynamic build args
    id: build_args_script
    shell: bash
    if: inputs.build_args_script
    env:
      BUILD_ARGS_SCRIPT: ${{ inputs.build_args_script }}
      GITHUB_TOKEN: ${{ github.token }}
      source_repository: ${{ inputs.source_repository }}
      source_ref: ${{ inputs.source_ref }}
      target_tag: ${{ inputs.target_tag }}
      target_dockerfile: ${{ steps.resolve_dockerfile.outputs.dockerfile }}
      platform: ${{ inputs.platform }}
    run: |
      set -euo pipefail
      # Kept as two statements on purpose: piping straight into grep would let
      # `|| true` swallow a failing script instead of failing the build.
      raw=""
      for script in $BUILD_ARGS_SCRIPT; do
        raw+="$("$script")"$'\n'
      done
      # Only well-formed KEY=value lines are build args; anything else the
      # script prints is progress logging on stderr.
      args="$(grep -E '^[A-Za-z_][A-Za-z0-9_]*=' <<< "$raw" || true)"
      echo "resolved build args: ${args:-<none>}"
      {
        echo "build_args<<BUILD_ARGS_EOF"
        echo "$args"
        echo "BUILD_ARGS_EOF"
      } >> "$GITHUB_OUTPUT"
      # build_script runs its own `docker build`, so hand it the args as env vars
      if [ -n "$args" ]; then
        echo "$args" >> "$GITHUB_ENV"
      fi
  - name: Set up Docker Context for Buildx
    shell: bash
    id: buildx-context
    run: |
      docker context use builders || docker context create builders
  - name: Set up Docker Buildx
    id: buildx_setup
    continue-on-error: true
    uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
    with:
      endpoint: builders
      # Builds don't log in to Docker Hub, so pull docker.io images through the
      # pull-through cache the runners' Docker daemon already uses. BuildKit
      # falls back to docker.io if the cache fails.
      buildkitd-config-inline: |
        [registry."docker.io"]
          mirrors = ["docker-cache.ethquokkaops.io"]
  - name: Wait before retrying Docker Buildx setup
    if: steps.buildx_setup.outcome == 'failure'
    shell: bash
    run: sleep 30
  - name: Set up Docker Buildx (retry)
    if: steps.buildx_setup.outcome == 'failure'
    uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
    with:
      endpoint: builders
      buildkitd-config-inline: |
        [registry."docker.io"]
          mirrors = ["docker-cache.ethquokkaops.io"]
  - name: Unlock MacOS keychain for registry login
    shell: bash
    if: runner.os == 'macOS'
    run: |
      security -v unlock-keychain -p ${{ inputs.MACOS_PASSWORD }} ~/Library/Keychains/login.keychain-db
  - name: Login to GHCR
    uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
    with:
      registry: ghcr.io
      username: ${{ github.actor }}
      password: ${{ github.token }}
  - name: Login to harbor registry
    if: ${{ inputs.harbor_registry != '' }}
    id: harbor_login
    continue-on-error: true
    uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
    with:
      registry: ${{ inputs.harbor_registry }}
      username: ${{ inputs.HARBOR_USERNAME }}
      password: ${{ inputs.HARBOR_PASSWORD }}
  ########################
  # Build script case
  #######################
  - name: Build script
    shell: bash
    if: inputs.build_script
    env:
      source_repository: ${{ inputs.source_repository }}
      source_ref: ${{ inputs.source_ref }}
      target_tag: ${{ inputs.target_tag }}
      target_repository: ghcr.io/${{ inputs.target_repository }}
      target_dockerfile: ${{ steps.resolve_dockerfile.outputs.dockerfile || './source/Dockerfile' }}
      source_git_commit_hash: ${{ steps.git_commit_hash.outputs.git_commit_hash }}
      source_git_commit_hash_full: ${{ steps.git_commit_hash_full.outputs.git_commit_hash_full }}
      GOPROXY: ${{ inputs.GOPROXY }}
      BAZEL_REMOTE_CACHE_PASSWORD: ${{ inputs.BAZEL_REMOTE_CACHE_PASSWORD }}
      build_method: ${{ inputs.build_method }}
    run: |
      ${{ inputs.build_script }}
  - name: Image digest & tags (build script)
    id: script_digest
    shell: bash
    if: inputs.build_script
    env:
      IMAGE: ghcr.io/${{ inputs.target_repository }}
      TARGET_TAG: ${{ inputs.target_tag }}
      COMMIT: ${{ steps.git_commit_hash.outputs.git_commit_hash }}
    run: |
      set -euo pipefail
      # The digest the script pushed this job's image as, from the local image,
      # so the mirror step attests what this job built rather than whatever the
      # tag points to by then.
      digests=$(docker image inspect --format '{{json .RepoDigests}}' "${IMAGE}:${TARGET_TAG}" \
        | jq -r --arg repo "$IMAGE" '.[] | select(startswith($repo + "@")) | sub("^[^@]*@"; "")' | sort -u)
      if [[ $(wc -w <<< "$digests") != 1 ]]; then
        echo "::error::Expected the build script to push ${IMAGE}:${TARGET_TAG} once, found digests: ${digests:-none}"
        exit 1
      fi
      echo "digest=${digests}" >> "$GITHUB_OUTPUT"
      cat << EOF
      digest: ${digests}
      tags:
        ${IMAGE}:${TARGET_TAG}
        ${IMAGE}:${TARGET_TAG}-${COMMIT}
      EOF
  ########################
  # Non build script case
  #######################
  - name: Inject GOPROXY into Dockerfile
    if: ${{ inputs.build_script == '' }}
    shell: bash
    run: |
      DOCKERFILE_PATH="${{ steps.resolve_dockerfile.outputs.dockerfile }}"
      if [[ -z "$DOCKERFILE_PATH" ]]; then
        # Set to default value explicitly if input is empty
        DOCKERFILE_PATH='./source/Dockerfile'
      fi
      awk '/^FROM/ { print; print "ENV GOPROXY=${{ inputs.GOPROXY }}"; next }1' ${DOCKERFILE_PATH} > Dockerfile.new
      mv Dockerfile.new ${DOCKERFILE_PATH}
  - name: Docker build & push
    if: ${{ inputs.build_script == '' }}
    id: docker_build
    uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
    with:
      context: ./source
      file: ${{ steps.resolve_dockerfile.outputs.dockerfile }}
      tags: |
        ghcr.io/${{ inputs.target_repository }}:${{ inputs.target_tag }}-${{ steps.git_commit_hash.outputs.git_commit_hash }}
        ghcr.io/${{ inputs.target_repository }}:${{ inputs.target_tag }}
      push: true
      platforms: ${{ inputs.platform }}
      build-args: |
        ${{ inputs.build_args }}
        ${{ steps.build_args_script.outputs.build_args }}
        COMMIT_HASH=${{ steps.git_commit_hash_full.outputs.git_commit_hash_full }}
        GIT_SHA=${{ steps.git_commit_hash_full.outputs.git_commit_hash_full }}
        GIT_BRANCH=${{ inputs.source_ref }}
        VERSION=${{ inputs.source_ref }}-${{ steps.git_commit_hash.outputs.git_commit_hash }}
      labels: |
        ethpandaops.io.repo=${{ inputs.source_repository }}
        ethpandaops.io.commitRef=${{ inputs.source_ref }}
        commit=${{ steps.git_commit_hash.outputs.git_commit_hash }}
        version=${{ inputs.source_ref }}
        buildnum=${{ github.run_number }}
  - name: Push to harbor registry (best-effort)
    if: ${{ inputs.build_script == '' && inputs.harbor_registry != '' && steps.harbor_login.outcome == 'success' }}
    continue-on-error: true
    shell: bash
    run: |
      echo "Pushing to harbor registry (best-effort)..."
      docker buildx imagetools create \
        --tag ${{ inputs.harbor_registry }}/${{ inputs.target_repository }}:${{ inputs.target_tag }}-${{ steps.git_commit_hash.outputs.git_commit_hash }} \
        --tag ${{ inputs.harbor_registry }}/${{ inputs.target_repository }}:${{ inputs.target_tag }} \
        ghcr.io/${{ inputs.target_repository }}:${{ inputs.target_tag }}-${{ steps.git_commit_hash.outputs.git_commit_hash }} || echo "Harbor push failed, continuing..."
  - name: Image digest & tags
    shell: bash
    if: ${{ inputs.build_script == '' }}
    run: |
      cat << EOF
      digest: ${{ steps.docker_build.outputs.digest }}
      tags:
        ghcr.io/${{ inputs.target_repository }}:${{ inputs.target_tag }}
        ghcr.io/${{ inputs.target_repository }}:${{ inputs.target_tag }}-${{ steps.git_commit_hash.outputs.git_commit_hash }}
      EOF
  # This job built every platform of this image, so it attests them all.
  - name: Mirror to Docker Hub
    uses: ./.github/actions/mirror
    with:
      tags: |
        ghcr.io/${{ inputs.target_repository }}:${{ inputs.target_tag }}
        ghcr.io/${{ inputs.target_repository }}:${{ inputs.target_tag }}-${{ steps.git_commit_hash.outputs.git_commit_hash }}
      digest: ${{ steps.docker_build.outputs.digest || steps.script_digest.outputs.digest }}
      mirror-url: ${{ inputs.IMAGE_MIRROR_URL }}
