name: Build silver docker image
run-name: "${{ inputs.repository }}@${{ inputs.ref }}${{ inputs.correlation_id && format(' [{0}]', inputs.correlation_id) || '' }}"

on:
  workflow_dispatch:
    inputs:
      repository:
        description: The source silver repository to build from
        default: gattaca-com/silver
        type: string
        required: true
      ref:
        description: The branch, tag or SHA to checkout and build from
        default: main
        type: string
        required: true
      docker_tag:
        description: Override target docker tag (defaults to the above source ref if left blank)
        type: string
        required: false
      correlation_id:
        description: Optional correlation ID passed through to the run name (used by integrations)
        type: string
        required: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.setup.outputs.platforms }}
      target_tag: ${{ steps.tag.outputs.docker_tag }}
      dockerfile: ${{ steps.dockerfile.outputs.dockerfile }}
      build_args: ${{ steps.dockerfile.outputs.build_args }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare Matrix
        id: setup
        uses: ./.github/actions/prepare
        with:
          client: 'silver'
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
      - name: Generate target tag
        id: tag
        uses: ./.github/actions/docker-tag
        with:
          input: ${{ inputs.docker_tag || inputs.ref }}
          repository: ${{ inputs.repository }}
          upstream_repository: gattaca-com/silver
          docker_tag: ${{ inputs.docker_tag }}
      - name: Resolve dockerfile (longest ./silver/Dockerfile.<prefix> of the tag)
        id: dockerfile
        env:
          TARGET_TAG: ${{ steps.tag.outputs.docker_tag }}
        run: |
          dockerfile=./source/Dockerfile
          build_args=
          tag="${TARGET_TAG%-minimal}"
          if [ "$tag" != "$TARGET_TAG" ]; then build_args=PRESET=minimal; fi
          match=
          for candidate in ./silver/Dockerfile.*; do
            suffix="${candidate#./silver/Dockerfile.}"
            case "$suffix" in *.dockerignore) continue ;; esac
            case "$tag" in
              "$suffix"|"$suffix"-*)
                if [ "${#suffix}" -gt "${#match}" ]; then match="$suffix"; fi ;;
            esac
          done
          if [ -n "$match" ]; then
            echo "Using per-tag Dockerfile: ./silver/Dockerfile.$match"
            dockerfile="./silver/Dockerfile.$match"
          fi
          echo "dockerfile=$dockerfile" >> "$GITHUB_OUTPUT"
          echo "build_args=$build_args" >> "$GITHUB_OUTPUT"
  deploy:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    needs:
      - prepare
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    strategy:
      matrix:
        include: ${{fromJson(needs.prepare.outputs.platforms)}}
    outputs:
      git_commit_hash: ${{ steps.set_output.outputs.git_commit_hash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install-deps
        with:
          repository: ${{ inputs.repository }}
      - uses: ./.github/actions/deploy
        id: deploy
        with:
          source_repository: ${{ inputs.repository }}
          source_ref: ${{ inputs.ref }}
          target_tag: ${{ needs.prepare.outputs.target_tag }}-${{ matrix.slug }}
          target_repository: ethpandaops/silver
          target_dockerfile: ${{ needs.prepare.outputs.dockerfile }}
          build_args: ${{ needs.prepare.outputs.build_args }}
          build_args_script: ./leanvm-sidecar/revision.sh
          platform: ${{ matrix.platform }}

          IMAGE_MIRROR_URL: "${{ secrets.IMAGE_MIRROR_URL }}"
          MACOS_PASSWORD: "${{ secrets.MACOS_PASSWORD }}"
          HARBOR_USERNAME: "${{ vars.HARBOR_USERNAME }}"
          HARBOR_PASSWORD: "${{ secrets.HARBOR_PASSWORD }}"
          harbor_registry: ${{ vars.HARBOR_REGISTRY }}

      # This step captures the git commit hash from the deploy action for job output
      - name: Set job output
        id: set_output
        run: echo "git_commit_hash=${{ steps.deploy.outputs.git_commit_hash }}" >> $GITHUB_OUTPUT
        shell: bash
  manifest:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    needs:
      - prepare
      - deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/manifest
        with:
          source_repository: ${{ inputs.repository }}
          source_ref: ${{ inputs.ref }}
          target_tag: ${{ needs.prepare.outputs.target_tag }}
          target_repository: ethpandaops/silver
          platforms: ${{ needs.prepare.outputs.platforms }}
          harbor_registry: ${{ vars.HARBOR_REGISTRY }}
          HARBOR_USERNAME: "${{ vars.HARBOR_USERNAME }}"
          HARBOR_PASSWORD: "${{ secrets.HARBOR_PASSWORD }}"
          git_commit_hash: ${{ needs.deploy.outputs.git_commit_hash }}

          IMAGE_MIRROR_URL: "${{ secrets.IMAGE_MIRROR_URL }}"
  notify:
    name: Discord Notification
    runs-on: ubuntu-latest
    needs:
      - prepare
      - deploy
      - manifest
    if: failure()
    steps:
      - name: Notify
        uses: nobrayner/discord-webhook@1766a33bf571acdcc0678f00da4fb83aad01ebc7 # v1
        with:
          github-token: ${{ secrets.github_token }}
          discord-webhook: ${{ secrets.DISCORD_WEBHOOK }}
