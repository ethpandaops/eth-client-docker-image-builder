name: Build ingress-nginx controller image

# Builds ingress-nginx/ (upstream controller v1.12.1 with a rebuilt, patched
# nginx binary). Pull requests build and test it; a manual run with push
# enabled publishes it. The build is reproducible, and the image is pushed only
# when its digest is the one pinned below, which is what deployments reference.

on:
  pull_request:
    paths:
      - ingress-nginx/**
      - .github/workflows/build-push-ingress-nginx.yml
  workflow_dispatch:
    inputs:
      push:
        description: Push the image to Docker Hub
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE: docker.io/ethpandaops/ingress-nginx-controller
  TAG: v1.12.1-patched.1
  EXPECTED_DIGEST: sha256:d60a8137cb2e7e04b87591facf5c8ed07b23fc240cf86817473e0b1df547b61f
  SOURCE_DATE_EPOCH: "1794960000"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The image digest depends on the BuildKit version (layer compression).
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
        with:
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
      - name: Build
        run: |
          docker buildx build --platform linux/amd64 --provenance=false --sbom=false \
            --build-arg SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" \
            --metadata-file metadata.json \
            --output "type=docker,name=$IMAGE:$TAG,rewrite-timestamp=true" \
            ingress-nginx/
          digest=$(jq -r '."containerimage.digest"' metadata.json)
          echo "built $IMAGE:$TAG@$digest"
          test "$digest" = "$EXPECTED_DIGEST"
      - name: Test
        run: ingress-nginx/test.sh "$IMAGE:$TAG"
      - name: Login to Docker Hub
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.push }}
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.push }}
        run: |
          docker buildx build --platform linux/amd64 --provenance=false --sbom=false \
            --build-arg SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" \
            --metadata-file pushed.json \
            --output "type=image,name=$IMAGE:$TAG,push=true,rewrite-timestamp=true" \
            ingress-nginx/
          digest=$(jq -r '."containerimage.digest"' pushed.json)
          echo "pushed $IMAGE:$TAG@$digest"
          test "$digest" = "$EXPECTED_DIGEST"
