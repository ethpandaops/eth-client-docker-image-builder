name: Build ingress-nginx controller image

# Builds ingress-nginx/ (upstream controller v1.12.1 with a rebuilt, patched
# nginx binary). Pull requests build and test it; a manual run with push
# enabled publishes it. The build is reproducible, and only an image whose
# digest is the one pinned below, which is what deployments reference, is
# pushed: the digest is checked on the local build before anything leaves the
# runner, and that exact archive is pushed.

on:
  pull_request:
    paths:
      - ingress-nginx/**
      - .github/workflows/build-push-ingress-nginx.yml
  workflow_dispatch:
    inputs:
      push:
        description: Push the image to Docker Hub
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE: docker.io/ethpandaops/ingress-nginx-controller
  TAG: v1.12.1-patched.1
  EXPECTED_DIGEST: sha256:eb226b2e4795498081e07ad632edbad889a590e9ddbd1a2ab4492442e8e50cf9
  SOURCE_DATE_EPOCH: "1794960000"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The image digest depends on the BuildKit version (layer compression).
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
        with:
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
      - name: Build
        run: |
          build() {
            docker buildx build --platform linux/amd64 --provenance=false --sbom=false \
              --build-arg SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" \
              --metadata-file "$1" --output "$2" ingress-nginx/
            digest=$(jq -r '."containerimage.digest"' "$1")
            echo "built $IMAGE:$TAG@$digest ($2)"
            test "$digest" = "$EXPECTED_DIGEST"
          }
          # Loaded into docker for the tests, and as an OCI archive to push.
          build docker.json "type=docker,name=$IMAGE:$TAG,rewrite-timestamp=true"
          build oci.json "type=oci,dest=image.oci.tar,rewrite-timestamp=true"
      - name: Test
        run: ingress-nginx/test.sh "$IMAGE:$TAG"
      - name: Login to Docker Hub
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.push }}
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.push }}
        run: |
          # The archive's manifest is the checked one; --preserve-digests makes
          # skopeo fail rather than push it under any other digest.
          skopeo copy --preserve-digests oci-archive:image.oci.tar "docker://$IMAGE:$TAG"
          pushed=sha256:$(skopeo inspect --raw "docker://$IMAGE:$TAG" | sha256sum | cut -d' ' -f1)
          echo "pushed $IMAGE:$TAG@$pushed"
          test "$pushed" = "$EXPECTED_DIGEST"
