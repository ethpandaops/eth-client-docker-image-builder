name: Vet

on:
  pull_request:
    branches:
      - master

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install Python dependencies
        run: pip install PyYAML
      - name: Generate config.yaml
        run: python3 generate_config.py
      - name: schema validate
        uses: nrkno/yaml-schema-validator-github-action@ee8c3b6b405672187eac7cbf2b1c870344661169 # v6.3.0
        with:
          schema: schema.yaml
          target: config.yaml
  duplicates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install Python dependencies
        run: pip install PyYAML
      - name: Generate config.yaml
        run: python3 generate_config.py
      - uses: mikefarah/yq@c14f446382944492701b16c1ddb48bb9dbe683e3 # v4.53.6
      - name: duplicate repository tag check
        run: |
          OUTPUT=$(yq 'group_by(.target.repository + ":" + .target.tag) | map(select(length>1))' config.yaml)
          if [ "$OUTPUT" != "[]" ]; then
            echo "Duplicate tag found in config.yaml"
            echo $OUTPUT
            exit 1
          fi
  runners:
    name: Build runner configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install Python dependencies
        run: pip install PyYAML
      - name: Validate runner labels
        run: |
          python3 - <<'PY'
          import re
          import yaml

          labels = []
          for path in ("runners.yaml", "runner_overrides.yaml"):
              with open(path, encoding="utf-8") as stream:
                  data = yaml.safe_load(stream) or {}
              stack = [data]
              while stack:
                  value = stack.pop()
                  if isinstance(value, dict):
                      stack.extend(value.values())
                  elif isinstance(value, str):
                      labels.append((path, value))

          invalid = [(path, label) for path, label in labels if not re.fullmatch(r"self-hosted-ghr-[A-Za-z0-9._-]+", label)]
          if invalid:
              for path, label in invalid:
                  print(f"{path}: unsupported build runner label {label!r}")
              raise SystemExit(1)
          PY
  notify:
    name: Discord Notification
    runs-on: ubuntu-latest
    needs:
      - validate
      - duplicates
      - runners
    if: failure()
    steps:
      - name: Notify
        uses: nobrayner/discord-webhook@1766a33bf571acdcc0678f00da4fb83aad01ebc7 # v1
        with:
          github-token: ${{ secrets.github_token }}
          discord-webhook: ${{ secrets.DISCORD_WEBHOOK }}
